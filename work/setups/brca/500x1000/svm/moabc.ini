[MVMOO_SETUP]
dataset = brca
mvmo_algorithm = abc_mo

# === DIMENSIONES (SVM = 500 ind) ===
# NSGA: 500 * 1000 = 500k evaluaciones
# ABC: 500 * 500 * 2 = 500k evaluaciones
pop = 500
generations = [500]
# Heurística: 10% de la población
limit = 50

# === OBJETIVOS ===
objectives = [["bal_acc", "svm"], "leanness"]

# === INICIALIZACIÓN ===
initial_features_strategy = uniform
initial_features_min = 0
initial_features_max = 50
use_big_defaults = true

# === ESTRATEGIA (Base) ===
sorting_strategy = crowding_distance_full
use_clone_repurposing = false
bitlist_mutation_operator = flip

# === OTROS ===
external_dataset = swedish
cross_validation = true
final_optimization = true