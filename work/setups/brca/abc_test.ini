[MVMOO_SETUP]
dataset = brca
views_to_use = ["mrna"]

# === ALGORITMO ===
mvmo_algorithm = abc_mo

# === PARÁMETROS DE POBLACIÓN (Ajustados a referencia NSGA2) ===
pop = 16
generations = [20]
# Parámetro exclusivo ABC: intentos fallidos antes de convertirse en Scout
limit = 5

# === OBJETIVOS ===
objectives = [["bal_acc", "naive_bayes"], "leanness"]

# === INICIALIZACIÓN (Ajustado a bin(uni0-30)) ===
feature_importance_categorical = lasso
feature_importance_survival = none
initial_features_strategy = binomial_from_uniform
initial_features_min = 0
initial_features_max = 30

# === VALIDACIÓN ===
inner_n_folds = 2
cross_validation = true
final_optimization = true

# === OPERADORES Y DIVERSIDAD ===
bitlist_mutation_operator = flip
sorting_strategy = crowding_distance_clone_index
use_clone_repurposing = true

# === OTROS ===
external_dataset = swedish
logistic_max_iter = 100