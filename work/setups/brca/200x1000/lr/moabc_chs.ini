[MVMOO_SETUP]
dataset = brca
mvmo_algorithm = abc_mo

# === DIMENSIONES ===
pop = 200
generations = [500]
limit = 20

# === OBJETIVOS ===
objectives = [["bal_acc", "logistic"], "leanness"]

# === INICIALIZACIÓN (Guiada) ===
feature_importance_categorical = lasso
initial_features_strategy = uniform
initial_features_min = 0
initial_features_max = 50
use_big_defaults = true

# === ESTRATEGIA (Completa) ===
# Penaliza clones Y los reemplaza (Repurposing)
sorting_strategy = crowding_distance_clone_index
use_clone_repurposing = true
# Mutación Simétrica para mantener la densidad de genes
bitlist_mutation_operator = symm

# === OTROS ===
external_dataset = swedish
logistic_max_iter = 100
cross_validation = true
final_optimization = true